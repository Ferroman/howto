title: Replace a word in the document
app:
  image: howto-gedit
  run: gedit /home/howto/notes.txt
viewport: 1280x720
steps:
  - do:
      - wait_for: {text: Notes for the next release}
  - do:
      - press: Control+h
  - do:
      - fill: {label: Find, value: colour}
  - do:
      - fill: {label: Replace with, value: accent colour}
  - do:
      - click: {role: button, name: Replace All}
  - do:
      - press: Escape
      - wait_for: {text: accent colour of the theme}
