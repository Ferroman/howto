# Runs the unit tests, the browser tests and the installer test on a clean
# Ubuntu, for the oldest and the newest Python that the package allows, and
# the desktop tests, which need Docker, once.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      # A browser test that is skipped is not a pass.
      HOWTO_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # One cache for each Python. With one name for both, the two jobs
          # race to save it, and the slower one ends with a warning.
          cache-suffix: python-${{ matrix.python }}
      - name: Install ffmpeg and img2webp
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg webp
      - name: Install Chromium
        run: uv run --extra test playwright install --with-deps chromium
      - name: Tests
        run: uv run --extra test pytest -ra -m "not desktop"
      - name: Installer test
        run: bash install.test.sh
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A desktop test that is skipped is not a pass.
      HOWTO_REQUIRE_DESKTOP: "1"
      HOWTO_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Chromium
        run: uv run --extra test playwright install --with-deps chromium
      - name: Build the base image
        run: uv run howto image
      - name: Desktop tests
        run: uv run --extra test pytest -ra -m desktop
